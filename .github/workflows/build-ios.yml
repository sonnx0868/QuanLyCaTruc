name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios @capacitor/preferences
          npm install -g @capacitor/assets # Cài công cụ tự tạo icon

      - name: Setup iOS Platform
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      # SỬA Ở ĐÂY: Tạo thư mục ảo và copy icon.png từ thư mục gốc vào
      - name: Generate App Icons
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          npx @capacitor/assets generate --ios

      - name: Build xcode archive
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          cd ios/App
          mkdir Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r App-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quanlycatruc-ios
          path: ios/App/App-unsigned.ipa
